apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # ждать 5 минут перед уменьшением
      policies:
        - type: Percent
          value: 25                     # уменьшать не более чем на 25% за раз
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0    # масштабировать вверх немедленно
      policies:
        - type: Pods
          value: 4                     # добавлять не более 4 Pod за раз
          periodSeconds: 60